[project]
name = "compute-pi"
version = "0.1.0"
description = "High-precision π calculator using the Chudnovsky algorithm"
readme = "README.md"
requires-python = ">=3.8.1"
dependencies = [
    "mpmath>=1.3.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.5.1",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Ignore missing imports for libraries without type annotations
[[tool.mypy.overrides]]
module = "mpmath.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "benchmarks.*"
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "--cov=compute_pi --cov-report=term-missing --cov-report=xml -v"
testpaths = ["tests"]

[tool.coverage.run]
source = ["compute_pi"]
omit = ["tests/*", "docs/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.benchmark.defaults]
min_rounds = 5
max_time = 1.0
warmup = false

[project.scripts]
compute-pi = "compute_pi.main:main"
