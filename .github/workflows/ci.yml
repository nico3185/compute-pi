name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Add permissions needed for GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"
        uv pip install --system types-tqdm types-psutil
        
    - name: Check formatting with black
      run: black . --check
        
    - name: Sort imports with isort
      run: isort . --check-only --diff
        
    - name: Lint with flake8
      run: flake8 .
        
    - name: Type check with mypy
      run: mypy .
        
    - name: Run tests with pytest
      run: pytest
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      continue-on-error: true
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  docker-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build test image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: compute-pi:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Run make check in Docker
        run: docker run --rm compute-pi:test

  docker:
    needs: [test, docker-test]
    runs-on: ubuntu-latest
    # Only run this job on the main branch and not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Make repo name lowercase for Docker compatibility
      - name: Prepare repository name
        id: prepare
        run: |
          echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
            
      - name: Build and push production image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: prod
          push: true
          tags: ghcr.io/${{ env.REPO_NAME }}:latest,ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
           
      - name: Build and push development image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: dev
          push: true
          tags: ghcr.io/${{ env.REPO_NAME }}:dev
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Prepare repository name
        id: prepare
        run: |
          echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          
      - name: Deploy to Demo Environment
        run: |
          echo "Deploying compute-pi version ${{ github.sha }} to demo environment"
          echo "Image: ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}"
          echo "This is a placeholder for real deployment commands"
          
      - name: Create Deployment Status
        run: |
          echo "Deployment to demo environment completed successfully"
          echo "Version: $(echo ${{ github.sha }} | cut -c1-7)"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Image URL: ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}" 