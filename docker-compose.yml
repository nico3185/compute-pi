services:
  app:
    build:
      context: .
      target: prod
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_USERNAME:-user}/compute-pi:latest
    container_name: compute-pi
    environment:
      - PYTHONUNBUFFERED=1

  dev:
    build:
      context: .
      target: dev
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_USERNAME:-user}/compute-pi:dev
    container_name: compute-pi-dev
    volumes:
      - .:/app
    command: pytest -v
    environment:
      - PYTHONUNBUFFERED=1 